
version: 2.1

jobs:
  backend-tests:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Install backend dependencies
          command: |
            cd backend
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Run Django tests
          command: |
            cd backend
            python manage.py test

  build-backend:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build backend Docker image
          command: |
            docker build -t taskflow-backend:circleci ./backend

  build-frontend:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build frontend Docker image
          command: |
            docker build \
              --build-arg VITE_API_URL=http://localhost:8000/api/tasks/ \
              -t taskflow-frontend:circleci ./frontend

  docker-publish:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Log in to Docker Hub
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin

      - run:
          name: Build and push backend image
          command: |
            docker build \
              -t "$DOCKERHUB_USERNAME/taskflow-backend:latest" \
              ./backend
            docker push "$DOCKERHUB_USERNAME/taskflow-backend:latest"

      - run:
          name: Build and push frontend image
          command: |
            docker build \
              --build-arg VITE_API_URL=http://localhost:8000/api/tasks/ \
              -t "$DOCKERHUB_USERNAME/taskflow-frontend:latest" \
              ./frontend
            docker push "$DOCKERHUB_USERNAME/taskflow-frontend:latest"

      - run:
          name: Log out from Docker Hub
          command: docker logout

workflows:
  taskflow-ci:
    jobs:
      - backend-tests

      - build-backend:
          requires:
            - backend-tests

      - build-frontend:
          requires:
            - backend-tests

      - docker-publish:
          requires:
            - build-backend
            - build-frontend
