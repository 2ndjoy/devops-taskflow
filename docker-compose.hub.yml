
services:
  backend:
    image: 2ndjoy/taskflow-backend:latest
    container_name: taskflow-backend-hub
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - taskflow_db:/app/data
    restart: unless-stopped
    
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/csrf/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  frontend:
    image: 2ndjoy/taskflow-frontend:latest
    container_name: taskflow-frontend-hub
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5174:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/tasks/
      VITE_AUTH_URL: http://localhost:8000/api/auth/
    restart: unless-stopped

volumes:
  taskflow_db:
